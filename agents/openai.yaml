  default_prompt: "使用 $ppt-skill-v3，提炼原稿主题与有效框架，结合目标学段和真实使用场景深度增强内容，按三步流程制作精品图片版PDF、班会教案或会议实施方案及逐字稿；后续可一次授权Canva修订、PPTX自动导出下载、本地文字字体排版优化及轻量教学动画。全部生图文字来自阶段1逐页文字，转可编辑、Canva和动画保持文字不变。全程使用文件读取、API及后台渲染，不前台打开Office/WPS或放映；文字字体排版优化保留实际预览和结果审阅；新动画按需看图、默认全安全页350ms淡入，保留内容与时间树检查，未验证范围如实说明。"
